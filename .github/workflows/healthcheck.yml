name: OpenClaw Health Check

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start OpenClaw
        run: |
          cp .env.example .env
          docker compose up -d
          sleep 15

      - name: Check health endpoint
        run: |
          status=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:18789/healthz || true)
          if [ "$status" = "200" ]; then
            echo "Health check passed"
          else
            echo "Health check failed (HTTP $status)"
            docker compose logs
            exit 1
          fi

      - name: Check readiness endpoint
        run: |
          status=$(curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1:18789/readyz || true)
          if [ "$status" = "200" ]; then
            echo "Readiness check passed"
          else
            echo "Readiness check failed (HTTP $status) — may need API key"
          fi

      - name: Cleanup
        if: always()
        run: docker compose down
