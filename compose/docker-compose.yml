services:
  openclaw:
    image: alpine/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    init: true
    env_file: ../.env
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    volumes:
      - ${OPENCLAW_WORKSPACE_DIR:-../workspace}:/home/node/.openclaw/workspace
      - ../skills:/home/node/.openclaw/skills:ro
      - ../config:/home/node/.openclaw/config:ro
      # Docker socket for sandbox mode (skill isolation)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
